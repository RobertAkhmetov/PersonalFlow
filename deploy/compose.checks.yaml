name: personalflow-checks
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: personalflow_checks
      POSTGRES_USER: checks
      POSTGRES_PASSWORD: ${CHECK_DB_PASSWORD:?required}
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U checks -d personalflow_checks"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql]
